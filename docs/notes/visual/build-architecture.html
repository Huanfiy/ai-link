<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superlink 工程编译架构</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          bg: '#0c1017',
          surface: { DEFAULT: '#141922', alt: '#1c2230' },
          border: { DEFAULT: '#2a3142', light: '#354058' },
          text: { DEFAULT: '#e2e6f0', secondary: '#7c849a', tertiary: '#505870' },
          accent: { DEFAULT: '#4d8eff', soft: 'rgba(77,142,255,0.1)' },
          teal: '#34d1b4', amber: '#f0b040', red: '#ef5050', purple: '#a78bfa',
        },
        fontFamily: {
          sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
        },
      },
    },
  };
  </script>
  <style>
    :root {
      --bg: #0c1017; --surface: #141922; --surface-alt: #1c2230;
      --border: #2a3142; --border-light: #354058;
      --text: #e2e6f0; --text-secondary: #7c849a; --text-tertiary: #505870;
      --accent: #4d8eff; --accent-soft: rgba(77,142,255,0.1);
      --teal: #34d1b4; --amber: #f0b040; --red: #ef5050; --purple: #a78bfa;
    }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .flow-line { stroke-dasharray: 8 4; animation: flow 1.5s linear infinite; }
    @keyframes fadeStepIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-step { animation: fadeStepIn 0.35s ease forwards; }
  </style>
  <!-- UMD：在 file:// 下可用；勿用 type=module + esm.sh import（易被浏览器拦截，页面空白） -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback } = React;

    const STEPS = [
      {
        id: 'config',
        title: '配置层',
        short: 'Kconfig',
        body: '主工程 Kconfig 串联 RT-Thread 内核与软件包菜单，并 rsource libraries/Kconfig（SoC/板级系列）。menuconfig 生成 rtconfig.h，编译时 building 脚本按宏做条件编译。',
        bullets: ['SOC_STM32F446RETX → STM32F4 系列', 'RT_USING_USER_MAIN 等由 Kconfig 选中'],
      },
      {
        id: 'pkgs',
        title: '依赖与预检',
        short: 'Packages',
        body: 'pkgs.json 声明 CMSIS-Core、STM32F4 HAL、STM32F4 CMSIS 等包；内容落在 packages/*-latest。SConstruct 注册 RegisterPreBuildingAction(bsp_pkg_check)，缺目录时提示先 pkgs --update。',
        bullets: ['与 RT-Thread env 包管理器配合', '预检失败则直接 exit，不进入编译'],
      },
      {
        id: 'scons',
        title: 'SCons 编排',
        short: 'SConstruct',
        body: '解析 RTT_ROOT（环境变量、~/SDK/rt-thread 或相对路径），将 RTT_ROOT/tools 加入 path 并 from building import *。PrepareBuilding 收集本仓库根目录 SConscript 递归产物（board、applications、packages 等子目录）。随后显式 extend HAL_Drivers 的 SConscript（variant_dir 到 build/libraries）。最后 DoBuilding 生成 rt-thread.elf。',
        bullets: ['rtconfig.py：工具链、CFLAGS、LFLAGS、链接脚本路径', '根 SConscript：遍历含 SConscript 的子目录'],
      },
      {
        id: 'toolchain',
        title: '工具链与产物',
        short: 'GCC / 链接',
        body: '默认 CROSS_TOOL=gcc，使用 arm-none-eabi-*；链接脚本 board/linker_scripts/link.lds。POST_ACTION 用 objcopy 产出 rtthread.bin，并 size 打印体积。',
        bullets: ['可切换 keil / iar（rtconfig.py 分支）', '产物：rt-thread.elf、rtthread.bin、map'],
      },
    ];

    function SvgDefs() {
      return (
        <defs>
          <marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 4 L 0 8 z" fill="var(--text-tertiary)" />
          </marker>
          <marker id="arrow-accent" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 4 L 0 8 z" fill="var(--accent)" />
          </marker>
        </defs>
      );
    }

    function GroupArea({ x, y, width, height, label, color = 'var(--accent)' }) {
      return (
        <g>
          <rect x={x} y={y} width={width} height={height} rx={12} fill={`color-mix(in srgb, ${color} 6%, transparent)`} stroke={color} strokeWidth={1} strokeDasharray="6 3" opacity={0.5} />
          <text x={x + 12} y={y + 16} fill={color} opacity={0.85} style={{ fontSize: '10px', fontWeight: 600, fontFamily: '"IBM Plex Mono"', textTransform: 'uppercase', letterSpacing: '0.05em' }}>{label}</text>
        </g>
      );
    }

    function NodeBox({ x, y, width, height, label, sublabel, color = 'var(--accent)', dimmed }) {
      return (
        <g style={{ opacity: dimmed ? 0.35 : 1, transition: 'opacity 0.3s ease' }}>
          <rect x={x} y={y} width={width} height={height} rx={8} fill="var(--surface-alt)" stroke={color} strokeWidth={1} style={{ transition: 'stroke 0.2s ease' }} />
          <text x={x + width / 2} y={y + (sublabel ? height / 2 - 5 : height / 2 + 2)} textAnchor="middle" dominantBaseline="middle" fill="var(--text)" style={{ fontSize: '13px', fontWeight: 600, fontFamily: '"IBM Plex Mono"' }}>{label}</text>
          {sublabel && (
            <text x={x + width / 2} y={y + height / 2 + 12} textAnchor="middle" dominantBaseline="middle" fill="var(--text-tertiary)" style={{ fontSize: '11px', fontFamily: '"IBM Plex Mono"' }}>{sublabel}</text>
          )}
        </g>
      );
    }

    function Arrow({ x1, y1, x2, y2, animated, label }) {
      return (
        <g>
          <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="var(--border-light)" strokeWidth={1.5} markerEnd="url(#arrow)" className={animated ? 'flow-line' : undefined} />
          {label && (
            <text x={(x1 + x2) / 2} y={(y1 + y2) / 2 - 8} textAnchor="middle" fill="var(--text-tertiary)" style={{ fontSize: '10px', fontFamily: '"IBM Plex Mono"' }}>{label}</text>
          )}
        </g>
      );
    }

    function DiagramConfig() {
      return (
        <svg viewBox="0 0 720 380" className="w-full max-w-3xl mx-auto" role="img" aria-label="Kconfig 配置流">
          <SvgDefs />
          <GroupArea x={16} y={24} width={688} height={140} label="Kconfig 来源" color="var(--amber)" />
          <NodeBox x={40} y={56} width={160} height={56} label="Kconfig" sublabel="工程入口" color="var(--amber)" />
          <NodeBox x={240} y={56} width={160} height={56} label="$RTT_ROOT/Kconfig" sublabel="内核/组件" color="var(--accent)" />
          <NodeBox x={440} y={56} width={130} height={56} label="$PKGS_ROOT" sublabel="软件包菜单" color="var(--purple)" />
          <NodeBox x={590} y={56} width={110} height={56} label="libraries" sublabel="Kconfig" color="var(--teal)" />
          <Arrow x1={200} y1={84} x2={240} y2={84} />
          <Arrow x1={400} y1={84} x2={440} y2={84} />
          <Arrow x1={570} y1={84} x2={590} y2={84} />
          <GroupArea x={16} y={188} width={688} height={168} label="生成物" color="var(--teal)" />
          <NodeBox x={200} y={232} width={200} height={52} label="rtconfig.h" sublabel="宏 / 特性开关" color="var(--teal)" />
          <NodeBox x={440} y={232} width={200} height={52} label="rtconfig.py" sublabel="工具链与编译选项" color="var(--accent)" />
          <Arrow x1={360} y1={140} x2={300} y2={232} animated label="menuconfig" />
          <Arrow x1={360} y1={140} x2={540} y2={232} label="并行使用" />
        </svg>
      );
    }

    function DiagramPkgs() {
      return (
        <svg viewBox="0 0 720 380" className="w-full max-w-3xl mx-auto" role="img" aria-label="软件包与预检">
          <SvgDefs />
          <GroupArea x={16} y={24} width={320} height={200} label="声明" color="var(--purple)" />
          <NodeBox x={40} y={56} width={272} height={48} label="packages/pkgs.json" sublabel="CMSIS / HAL / CMSIS-Driver" color="var(--purple)" />
          <NodeBox x={40} y={124} width={272} height={84} label="packages/*-latest" sublabel="拉取后的源码树" color="var(--teal)" />
          <GroupArea x={360} y={24} width={344} height={200} label="构建前" color="var(--amber)" />
          <NodeBox x={384} y={56} width={296} height={56} label="bsp_pkg_check" sublabel="RegisterPreBuildingAction" color="var(--amber)" />
          <NodeBox x={384} y={132} width={296} height={76} label="缺包 → 提示 pkgs --update" sublabel="否则 exit(1)" color="var(--red)" />
          <Arrow x1={176} y1={104} x2={176} y2={124} animated label="sync" />
          <Arrow x1={312} y1={166} x2={384} y2={88} label="存在性检查" />
        </svg>
      );
    }

    function DiagramScons() {
      return (
        <svg viewBox="0 0 760 420" className="w-full max-w-4xl mx-auto" role="img" aria-label="SCons 构建流程">
          <SvgDefs />
          <GroupArea x={12} y={16} width={736} height={100} label="入口" color="var(--accent)" />
          <NodeBox x={28} y={44} width={120} height={56} label="SConstruct" sublabel="SDK 根" color="var(--accent)" />
          <NodeBox x={168} y={44} width={140} height={56} label="building" sublabel="RTT_ROOT/tools" color="var(--purple)" />
          <NodeBox x={328} y={44} width={160} height={56} label="Environment" sublabel="rtconfig.py" color="var(--amber)" />
          <NodeBox x={508} y={44} width={220} height={56} label="PrepareBuilding" sublabel="has_libcpu=False" color="var(--teal)" />
          <Arrow x1={148} y1={72} x2={168} y2={72} />
          <Arrow x1={308} y1={72} x2={328} y2={72} />
          <Arrow x1={488} y1={72} x2={508} y2={72} />
          <GroupArea x={12} y={132} width={360} height={200} label="根 SConscript 子树" color="var(--teal)" />
          <NodeBox x={36} y={164} width={100} height={44} label="board" sublabel="板级 + CubeMX" color="var(--teal)" />
          <NodeBox x={150} y={164} width={100} height={44} label="applications" sublabel="应用 .c" color="var(--teal)" />
          <NodeBox x={264} y={164} width={92} height={44} label="packages" sublabel="HAL/CMSIS" color="var(--purple)" />
          <NodeBox x={36} y={228} width={320} height={44} label="./SConscript" sublabel="遍历子目录 SConscript" color="var(--accent)" />
          <GroupArea x={392} y={132} width={356} height={200} label="HAL 驱动（额外挂载）" color="var(--amber)" />
          <NodeBox x={416} y={180} width={308} height={72} label="libraries/HAL_Drivers/SConscript" sublabel="variant_dir → build/libraries/..." color="var(--amber)" />
          <Arrow x1={568} y1={116} x2={568} y2={180} animated />
          <GroupArea x={12} y={348} width={736} height={64} label="收尾" color="var(--accent)" />
          <NodeBox x={200} y={364} width={360} height={44} label="DoBuilding(TARGET, objs)" sublabel="TARGET = rt-thread. + TARGET_EXT" color="var(--accent)" />
        </svg>
      );
    }

    function DiagramToolchain() {
      return (
        <svg viewBox="0 0 720 360" className="w-full max-w-3xl mx-auto" role="img" aria-label="工具链与产物">
          <SvgDefs />
          <GroupArea x={16} y={20} width={300} height={200} label="工具链" color="var(--amber)" />
          <NodeBox x={40} y={52} width={252} height={48} label="arm-none-eabi-gcc" sublabel="AS / CC / LINK" color="var(--amber)" />
          <NodeBox x={40} y={116} width={252} height={44} label="CFLAGS / LFLAGS" sublabel="-mcpu=cortex-m4 ..." color="var(--text-secondary)" />
          <NodeBox x={40} y={172} width={252} height={40} label="link.lds" sublabel="board/linker_scripts" color="var(--teal)" />
          <GroupArea x={336} y={20} width={368} height={200} label="产物" color="var(--accent)" />
          <NodeBox x={360} y={52} width={160} height={48} label="rt-thread.elf" sublabel="调试 / 下载" color="var(--accent)" />
          <NodeBox x={536} y={52} width={152} height={48} label="rtthread.bin" sublabel="objcopy -O binary" color="var(--teal)" />
          <NodeBox x={360} y={120} width={328} height={44} label="rt-thread.map" sublabel="链接映射" color="var(--text-tertiary)" />
          <NodeBox x={360} y={176} width={328} height={40} label="POST_ACTION" sublabel="size + bin" color="var(--purple)" />
          <Arrow x1={292} y1={76} x2={360} y2={76} animated label="链接" />
          <Arrow x1={520} y1={76} x2={536} y2={76} label="objcopy" />
        </svg>
      );
    }

    const DIAGRAMS = [DiagramConfig, DiagramPkgs, DiagramScons, DiagramToolchain];

    function StepButtons({ current, onChange }) {
      return (
        <div className="flex flex-wrap gap-2 justify-end">
          {STEPS.map((s, i) => (
            <button
              key={s.id}
              type="button"
              onClick={() => onChange(i)}
              className={`px-3 py-1.5 rounded-lg text-sm font-mono transition-colors border ${
                i === current ? 'bg-accent/15 border-accent text-text' : 'bg-surface-alt border-border text-text-secondary hover:border-border-light'
              }`}
            >
              {i + 1}. {s.short}
            </button>
          ))}
        </div>
      );
    }

    function App() {
      const [step, setStep] = useState(0);
      const s = STEPS[step];
      const Diagram = DIAGRAMS[step];
      const next = useCallback(() => setStep((i) => (i + 1) % STEPS.length), []);
      const prev = useCallback(() => setStep((i) => (i - 1 + STEPS.length) % STEPS.length), []);

      return (
        <div className="min-h-screen p-6 md:p-10 max-w-5xl mx-auto">
          <header className="mb-8 flex flex-col md:flex-row md:items-start md:justify-between gap-4">
            <div>
              <h1 className="text-2xl font-semibold text-text tracking-tight">Superlink 编译架构</h1>
              <p className="mt-2 text-sm text-text-secondary max-w-xl">
                本工程为 RT-Thread BSP：Kconfig 与 rtconfig 定特性与工具链；SCons 从 RTT_ROOT 引入 building，聚合 board / applications / packages，并单独编入 HAL_Drivers。
              </p>
            </div>
            <StepButtons current={step} onChange={setStep} />
          </header>

          <div className="grid md:grid-cols-5 gap-6 items-start">
            <div className="md:col-span-3 bg-surface border border-border rounded-xl p-4 md:p-6 overflow-hidden">
              <div key={s.id} className="fade-step">
                <Diagram />
              </div>
              <div className="flex justify-between mt-4 pt-4 border-t border-border">
                <button type="button" onClick={prev} className="text-sm text-text-secondary hover:text-text font-mono">← 上一步</button>
                <button type="button" onClick={next} className="text-sm text-accent hover:underline font-mono">下一步 →</button>
              </div>
            </div>

            <div className="md:col-span-2 bg-surface-alt border border-border rounded-xl p-5">
              <div key={s.id} className="fade-step">
                <h2 className="text-lg font-semibold text-text">{s.title}</h2>
                <p className="mt-3 text-sm text-text-secondary leading-relaxed">{s.body}</p>
                <ul className="mt-4 space-y-2 text-sm text-text-tertiary list-disc pl-4 marker:text-accent">
                  {s.bullets.map((b) => (
                    <li key={b} className="font-mono text-xs md:text-sm">{b}</li>
                  ))}
                </ul>
              </div>
            </div>
          </div>

          <footer className="mt-10 text-center text-xs text-text-tertiary font-mono">
            路径参照仓库根目录：SConstruct · SConscript · Kconfig · rtconfig.py · packages/
          </footer>
        </div>
      );
    }

    const rootEl = document.getElementById('root');
    if (typeof ReactDOM !== 'undefined' && ReactDOM.createRoot) {
      ReactDOM.createRoot(rootEl).render(<App />);
    } else {
      rootEl.innerHTML = '<p style="padding:1rem;color:#e2e6f0;font-family:system-ui">无法加载 React（请检查网络或改用本地 HTTP 服务打开本页）。</p>';
    }
  </script>
</body>
</html>
