<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="456" viewBox="0 0 1040 456" role="img" aria-labelledby="title desc">
  <title id="title">ailink 引脚接线速查</title>
  <desc id="desc">3.3 V 逻辑，ailink 与所有外部设备必须共地。串口 A：PC6 TX 接目标 RX，PC7 RX 接目标 TX；串口 B：PA9 TX 接目标 RX，PA10 RX 接目标 TX。SWD：PA4 接 SWCLK，PA5 双向连接 SWDIO，PA6 接 nRESET。GPIO bit 0–7 对应 PB0、PB1、PA0、PB8、PB9、PB10、PA1、PA8。本图为信号映射，不代表排针物理顺序。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .heading { font-size: 20px; font-weight: 700; }
      .note { font-size: 15px; fill: #475569; }
      .pin { font-family: "DejaVu Sans Mono", monospace; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .wire { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <g id="right" class="wire"><path d="M0 0H46m-6-5 6 5-6 5"/></g>
    <g id="left" class="wire"><path d="M46 0H0m6-5-6 5 6 5"/></g>
    <g id="both" class="wire"><path d="M0 0H46m-6-5 6 5-6 5M6-5 0 0l6 5"/></g>
    <rect id="gpio-cell" width="106" height="58" rx="8" fill="#ecfdf5"/>
  </defs>
  <rect x="1" y="1" width="1038" height="454" rx="20" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="32" y="42" font-size="23" font-weight="700" fill="#0f172a">引脚接线速查</text>
  <rect x="826" y="20" width="182" height="30" rx="15" fill="#fff7ed"/>
  <text x="917" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">3.3 V 逻辑 · 必须共地</text>

  <!-- UART: label both ends so crossing and direction are unambiguous. -->
  <g transform="translate(28 70)">
    <rect width="316" height="194" rx="12" fill="#fff" stroke="#bfdbfe"/>
    <text x="20" y="34" class="heading" fill="#2563eb">串口 A</text>
    <text x="296" y="33" text-anchor="end" class="note">if00</text>
    <path d="M20 50H296" stroke="#dbeafe"/>
    <text x="20" y="76" class="note">ailink</text><text x="236" y="76" class="note">目标</text>
    <text x="20" y="116" class="pin">PC6 <tspan font-weight="400" fill="#475569">TX</tspan></text>
    <use href="#right" x="166" y="109" color="#2563eb"/>
    <text x="236" y="116" class="pin">RX</text>
    <text x="20" y="158" class="pin">PC7 <tspan font-weight="400" fill="#475569">RX</tspan></text>
    <use href="#left" x="166" y="151" color="#2563eb"/>
    <text x="236" y="158" class="pin">TX</text>
  </g>

  <g transform="translate(362 70)">
    <rect width="316" height="194" rx="12" fill="#fff" stroke="#a5f3fc"/>
    <text x="20" y="34" class="heading" fill="#0891b2">串口 B</text>
    <text x="296" y="33" text-anchor="end" class="note">if02</text>
    <path d="M20 50H296" stroke="#cffafe"/>
    <text x="20" y="76" class="note">ailink</text><text x="236" y="76" class="note">目标</text>
    <text x="20" y="116" class="pin">PA9 <tspan font-weight="400" fill="#475569">TX</tspan></text>
    <use href="#right" x="166" y="109" color="#0891b2"/>
    <text x="236" y="116" class="pin">RX</text>
    <text x="20" y="158" class="pin">PA10 <tspan font-weight="400" fill="#475569">RX</tspan></text>
    <use href="#left" x="166" y="151" color="#0891b2"/>
    <text x="236" y="158" class="pin">TX</text>
  </g>

  <g transform="translate(696 70)">
    <rect width="316" height="194" rx="12" fill="#fff" stroke="#ddd6fe"/>
    <text x="20" y="34" class="heading" fill="#7c3aed">SWD</text>
    <path d="M20 50H296" stroke="#ede9fe"/>
    <text x="20" y="76" class="note">ailink</text><text x="202" y="76" class="note">目标 MCU</text>
    <text x="20" y="110" class="pin">PA4</text>
    <use href="#right" x="127" y="103" color="#7c3aed"/>
    <text x="202" y="110" class="pin">SWCLK</text>
    <text x="20" y="143" class="pin">PA5</text>
    <use href="#both" x="127" y="136" color="#7c3aed"/>
    <text x="202" y="143" class="pin">SWDIO</text>
    <text x="20" y="176" class="pin">PA6</text>
    <use href="#right" x="127" y="169" color="#7c3aed"/>
    <text x="202" y="176" class="pin">nRESET</text>
  </g>

  <!-- One compact bank replaces eight repeated input/output descriptions. -->
  <rect x="28" y="282" width="984" height="122" rx="12" fill="#fff" stroke="#a7f3d0"/>
  <text x="48" y="314" class="heading" fill="#059669">GPIO</text>
  <text x="992" y="313" text-anchor="end" class="note">bit → MCU 引脚 · 输出前先配置方向</text>
  <g text-anchor="middle">
    <g transform="translate(48 330)"><use href="#gpio-cell"/><text x="53" y="21" class="note">bit 0</text><text x="53" y="46" class="pin">PB0</text></g>
    <g transform="translate(168 330)"><use href="#gpio-cell"/><text x="53" y="21" class="note">bit 1</text><text x="53" y="46" class="pin">PB1</text></g>
    <g transform="translate(288 330)"><use href="#gpio-cell"/><text x="53" y="21" class="note">bit 2</text><text x="53" y="46" class="pin">PA0</text></g>
    <g transform="translate(408 330)"><use href="#gpio-cell"/><text x="53" y="21" class="note">bit 3</text><text x="53" y="46" class="pin">PB8</text></g>
    <g transform="translate(528 330)"><use href="#gpio-cell"/><text x="53" y="21" class="note">bit 4</text><text x="53" y="46" class="pin">PB9</text></g>
    <g transform="translate(648 330)"><use href="#gpio-cell"/><text x="53" y="21" class="note">bit 5</text><text x="53" y="46" class="pin">PB10</text></g>
    <g transform="translate(768 330)"><use href="#gpio-cell"/><text x="53" y="21" class="note">bit 6</text><text x="53" y="46" class="pin">PA1</text></g>
    <g transform="translate(888 330)"><use href="#gpio-cell"/><text x="53" y="21" class="note">bit 7</text><text x="53" y="46" class="pin">PA8</text></g>
  </g>
  <text x="32" y="436" class="note">公共地：ailink GND — 所有外部设备 GND</text>
  <text x="1008" y="436" text-anchor="end" class="note">信号映射示意 · 非排针物理顺序</text>
</svg>
